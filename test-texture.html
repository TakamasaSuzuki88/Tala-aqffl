<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texture Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-family: monospace;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">Loading textures...</div>
    <script src="/libs/three.min.js"></script>
    <script>
        const info = document.getElementById('info');
        let loadedCount = 0;
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Add lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 0, 10);
        scene.add(light);
        
        // Create 9 boxes with textures
        const positions = [
            [-2, 2, 0], [0, 2, 0], [2, 2, 0],
            [-2, 0, 0], [0, 0, 0], [2, 0, 0],
            [-2, -2, 0], [0, -2, 0], [2, -2, 0]
        ];
        
        const textureLoader = new THREE.TextureLoader();
        
        positions.forEach((pos, index) => {
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 0.2);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...pos);
            scene.add(mesh);
            
            const imagePath = `/mandala/0${index + 1}.jpg`;
            console.log(`Loading: ${imagePath}`);
            
            textureLoader.load(
                imagePath,
                (texture) => {
                    console.log(`✓ Loaded: ${imagePath}`);
                    mesh.material.map = texture;
                    mesh.material.needsUpdate = true;
                    loadedCount++;
                    info.innerHTML = `Loaded ${loadedCount}/9 textures<br>Last: ${imagePath}`;
                },
                undefined,
                (error) => {
                    console.error(`✗ Failed: ${imagePath}`, error);
                    mesh.material.color = new THREE.Color(0xff0000);
                    info.innerHTML += `<br>Error loading ${imagePath}`;
                }
            );
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            scene.children.forEach(child => {
                if (child.isMesh) {
                    child.rotation.y += 0.01;
                }
            });
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
