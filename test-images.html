<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test</title>
    <style>
        body {
            padding: 20px;
            background: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 10px;
        }
        .item {
            width: 150px;
            height: 150px;
            position: relative;
            border: 2px solid white;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Image Mapping Test</h1>
    <div class="grid">
        <div class="item">
            <img src="/mandala/01.jpg" alt="1">
            <div class="label">1. 音楽</div>
        </div>
        <div class="item">
            <img src="/mandala/02.jpg" alt="2">
            <div class="label">2. 映像</div>
        </div>
        <div class="item">
            <img src="/mandala/03.jpg" alt="3">
            <div class="label">3. 絵画</div>
        </div>
        <div class="item">
            <img src="/mandala/04.jpg" alt="4">
            <div class="label">4. 写真</div>
        </div>
        <div class="item">
            <img src="/mandala/05.jpg" alt="5">
            <div class="label">5. 思想</div>
        </div>
        <div class="item">
            <img src="/mandala/06.jpg" alt="6">
            <div class="label">6. 言葉</div>
        </div>
        <div class="item">
            <img src="/mandala/07.jpg" alt="7">
            <div class="label">7. マネタイズ</div>
        </div>
        <div class="item">
            <img src="/mandala/08.jpg" alt="8">
            <div class="label">8. ゲーム</div>
        </div>
        <div class="item">
            <img src="/mandala/09.jpg" alt="9">
            <div class="label">9. リンク集</div>
        </div>
    </div>
</body>
</html>
